context:
  name: azure-mgmt-synapse
  version: 2.1.0b5

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/azure-mgmt-synapse-${{ version }}.zip
    sha256: e44e987f51a03723558ddf927850db843c67380e9f3801baa288f1b423f89be9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - msrest >=0.6.21
    - azure-common >=1.1,<2.0
    - azure-mgmt-core >=1.3.0,<2.0

tests:
  - python:
      imports:
        - azure.mgmt.synapse
        - azure.mgmt.synapse.aio
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Microsoft Azure Synapse Management Client Library for Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Azure/azure-sdk-for-python

extra:
  recipe-maintainers:
    - janjagusch
